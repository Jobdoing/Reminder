name: reminder
description: "A local-first photo and voice aid for people who need help remembering."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  uuid: ^4.0.0
  camera: ^0.12.0
  permission_handler: ^12.0.1
  flutter_image_compress: ^2.5.1
  native_device_orientation: ^2.0.3
  flutter_contacts: ^2.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  pinyin: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
